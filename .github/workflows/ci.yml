name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    # See https://github.com/marketplace/actions/setup-miniconda#important
    shell: bash -el {0}

jobs:
  simulate-and-reconstruct:
    name: Simulate and reconstruct
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      OUT_DIR: ${{ github.workspace }}/ci_output

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: petsird-analytic-simulator
          environment-file: environment.yml

      - name: Show package versions
        run: |
          python -c "from importlib.metadata import version; print('petsird', version('petsird')); print('parallelproj', version('parallelproj'))"

      - name: Simulate PETSIRD listmode data
        working-directory: python
        run: |
          python 01_analytic_petsird_lm_simulator.py \
            --output_dir "$OUT_DIR" \
            --phantom squares \
            --img_shape 55,55,19 \
            --num_true_counts 200000 \
            --check_backprojection \
            --skip_plots

      - name: Reconstruct PETSIRD listmode data (TOF, no attenuation correction)
        working-directory: python
        run: |
          python 02_reconstruct_petsird.py "$OUT_DIR/simulated_petsird_lm_file.bin" \
            --img_shape 55 55 19 \
            --num_epochs 1 \
            --num_subsets 5

      - name: Reconstruct PETSIRD listmode data (TOF, attenuation correction)
        working-directory: python
        run: |
          python 02_reconstruct_petsird.py "$OUT_DIR/simulated_petsird_lm_file.bin" \
            --img_shape 55 55 19 \
            --num_epochs 1 \
            --num_subsets 5 \
            --attenuation_image "$OUT_DIR/attenuation_image.npy"

      - name: Check PETSIRD file and reconstructions
        run: |
          python tests/check_simulation_and_recon.py "$OUT_DIR" --require_all_references

      - name: Run petsird analysis on the simulated file
        run: |
          python -m petsird.helpers.analysis -i "$OUT_DIR/simulated_petsird_lm_file.bin" > /dev/null
